name: BenchEdge Social Autopilot
on:
  schedule:
    - cron: '0 14 * * 1,3,5'  # Runs Mon/Wed/Fri at 9:00 AM EST (14:00 UTC)
  workflow_dispatch:           # Allows manual 1-click test runs

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install pillow google-api-python-client google-auth-oauthlib gspread praw requests
      - name: Render 9:16 Vertical Short
        run: python3 benchedge_shorts_factory.py --campaign CAMP-02 --out short.mp4
      - name: Dispatch to YouTube & TikTok Drafts
        env:
          YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: |
          python3 benchedge_channel_automator.py --channel youtube --mp4 short.mp4 --publish
          python3 benchedge_channel_automator.py --channel tiktok --mp4 short.mp4 --publish
